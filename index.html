<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Asistencia QR
</title>


<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

body{

font-family:Arial, sans-serif;

text-align:center;

background:#f4f6f7;

padding:20px;

}


h1{

color:#1b4d3e;

}


#lector{

width:320px;

margin:auto;

}


button{

background:#1b4d3e;

color:white;

border:none;

padding:15px 30px;

border-radius:10px;

font-size:18px;

}


#resultado{

margin-top:20px;

font-size:20px;

font-weight:bold;

}


</style>


</head>


<body>


<h1>
Asistencia QR
</h1>


<button onclick="iniciarScanner()">

Iniciar escáner

</button>


<br><br>


<div id="lector"></div>


<div id="resultado">

Esperando lectura...

</div>



<script>


let scanner;

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwL1KeSZCW4-JaVntEQGYYR5qVm8NFBZ8I7VMDn8UWsnjzxtmFmn2NDOEXFl4pYp5Kmvw/exec";



function iniciarScanner(){


scanner = new Html5QrcodeScanner(

"lector",

{
fps:10,
qrbox:{
width:250,
height:250
}
},

false

);


scanner.render(

codigoLeido,

errorLectura

);


}



async function codigoLeido(codigo){

    scanner.clear();

    const datos = codigo.split("|");

    const estudiante = {

        codigo: datos[0],
        apellidos: datos[1] + " " + datos[2],
        nombres: datos[3] + " " + datos[4],
        sede: datos[5],
        curso: datos[6]

    };

    document.getElementById("resultado").innerHTML =
        "Registrando asistencia...";

    try{

        const respuesta = await fetch(URL_SCRIPT,{
            method:"POST",
            redirect:"follow",
            headers:{
                "Content-Type":"text/plain;charset=utf-8"
            },
            body:JSON.stringify(estudiante)
        });

        const resultado = await respuesta.json();

        if(resultado.ok){

            document.getElementById("resultado").innerHTML=
            "✅ Asistencia registrada<br><br>" +

            estudiante.nombres + "<br>" +

            estudiante.apellidos + "<br>" +

            estudiante.curso;

        }else{

            document.getElementById("resultado").innerHTML=
            "❌ Error al registrar";

        }

    }catch(error){

        console.log(error);

        document.getElementById("resultado").innerHTML=
        "❌ Error de conexión";

    }

    setTimeout(function(){

        iniciarScanner();

    },2000);

}
</script>


</body>


</html>
