<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Asistencia QR</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #f4f6f8;
    }

    .contenedor {
      width: 90%;
      max-width: 500px;

      background: white;

      padding: 30px;

      border-radius: 15px;

      text-align: center;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.10);
    }

    h1 {
      margin-bottom: 10px;
    }

    #estado {
      margin-top: 25px;

      padding: 15px;

      border-radius: 10px;

      background: #eeeeee;
    }

    button {
      margin-top: 20px;

      padding: 12px 25px;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      font-size: 16px;
    }

  </style>

</head>

<body>

  <div class="contenedor">

    <h1>Asistencia QR</h1>

    <p>
      Sistema de registro de asistencia
    </p>

    <div id="estado">
      Comprobando conexión...
    </div>

    <button onclick="probarConexion()">
      Comprobar conexión
    </button>

  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwA1aWSjxISmZU3FIRHuU2mzH2hBDVqlKCykqsXsPI056Q3qUZ79nXXh_d0L4ih5CL1/exec";


    async function probarConexion() {

      const estado =
        document.getElementById("estado");

      estado.textContent =
        "Comprobando conexión...";

      try {

        const respuesta =
          await fetch(
            API_URL + "?accion=estado"
          );

        const datos =
          await respuesta.json();

        if (datos.ok) {

          estado.textContent =
            "✓ Servidor conectado";

        } else {

          estado.textContent =
            "⚠ El servidor respondió, pero existe un problema";

        }

      } catch (error) {

        console.error(error);

        estado.textContent =
          "✕ No se pudo conectar con el servidor";
      }

    }


    probarConexion();

  </script>

</body>

</html>
