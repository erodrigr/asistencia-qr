<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Asistencia QR</title>


  <style>

    body {

      font-family: Arial, sans-serif;

      margin: 0;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background: #f4f6f8;
    }


    .contenedor {

      width: 90%;

      max-width: 500px;

      background: white;

      padding: 30px;

      border-radius: 15px;

      text-align: center;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.10);
    }


    h1 {

      margin-bottom: 10px;
    }


    .campo {

      width: 100%;

      box-sizing: border-box;

      padding: 12px;

      margin-top: 10px;

      border: 1px solid #ccc;

      border-radius: 8px;

      font-size: 18px;

      text-align: center;
    }


    button {

      width: 100%;

      margin-top: 20px;

      padding: 13px;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      font-size: 17px;
    }


    #estado {

      margin-top: 20px;

      padding: 12px;

      border-radius: 8px;

      background: #eeeeee;
    }


    #resultado {

      margin-top: 20px;

      padding: 15px;

      border-radius: 8px;

      min-height: 30px;
    }

  </style>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
</head>


<body>


  <div class="contenedor">

    <h1>Asistencia QR</h1>

    <p>
      Registro de asistencia
    </p>


    <div id="estado">

      Comprobando conexión...

    </div>


    <input
      id="idEstudiante"
      class="campo"
      type="text"
      placeholder="ID del estudiante"
      autocomplete="off"
    >


    <button onclick="registrar()">

      Registrar asistencia

    </button>


    <div id="resultado">

    </div>

    <hr>

<h2>Lector QR</h2>

<div id="lectorQR"></div>

<button onclick="iniciarLector()">
  Iniciar cámara
</button>

<button onclick="detenerLector()">
  Detener cámara
</button>

  </div>


  
  <script>


    const API_URL =
      "https://script.google.com/macros/s/AKfycbwA1aWSjxISmZU3FIRHuU2mzH2hBDVqlKCykqsXsPI056Q3qUZ79nXXh_d0L4ih5CL1/exec";


    // --------------------------------
    // COMPROBAR CONEXIÓN
    // --------------------------------

    async function probarConexion() {

      const estado =
        document.getElementById("estado");


      try {

        const respuesta =
          await fetch(
            API_URL + "?accion=estado"
          );


        const datos =
          await respuesta.json();


        if (datos.ok) {

          estado.textContent =
            "✓ Servidor conectado";

        } else {

          estado.textContent =
            "⚠ El servidor respondió con un problema";
        }


      } catch (error) {

        console.error(error);

        estado.textContent =
          "✕ No se pudo conectar con el servidor";
      }

    }


    // --------------------------------
    // REGISTRAR ASISTENCIA
    // --------------------------------

async function registrar() {

  const campo =
    document.getElementById("idEstudiante");

  const resultado =
    document.getElementById("resultado");

  const id =
    campo.value.trim();


  if (!id) {

    resultado.innerHTML =
      "⚠ Escriba el ID del estudiante";

    return;
  }


  resultado.innerHTML =
    "Registrando asistencia...";


  try {

    const respuesta =
      await fetch(
        API_URL +
        "?accion=registrarAsistencia&id=" +
        encodeURIComponent(id)
      );


    const datos =
      await respuesta.json();


    console.log(datos);


    // --------------------------------
    // ASISTENCIA REGISTRADA
    // --------------------------------

    if (
      datos.ok &&
      datos.tipo === "REGISTRADA"
    ) {

      const estudiante =
        datos.estudiante;

      const asistencia =
        datos.asistencia;


      resultado.innerHTML = `
        <div>
          <h2>✓ ASISTENCIA REGISTRADA</h2>

          <p>
            <strong>
              ${estudiante.nombres}
            </strong>
          </p>

          <p>
            <strong>
              ${estudiante.apellidos}
            </strong>
          </p>

          <p>
            Curso: ${asistencia.curso}
          </p>

          <p>
            Fecha: ${asistencia.fecha}
          </p>
        </div>
      `;


      campo.value = "";


      return;
    }


    // --------------------------------
    // DUPLICADO
    // --------------------------------

    if (
      datos.tipo === "DUPLICADO"
    ) {

      const estudiante =
        datos.estudiante;


      resultado.innerHTML = `
        <div>

          <h2>⚠ ASISTENCIA YA REGISTRADA</h2>

          <p>
            <strong>
              ${estudiante.nombres}
            </strong>
          </p>

          <p>
            <strong>
              ${estudiante.apellidos}
            </strong>
          </p>

          <p>
            Fecha: ${datos.fecha}
          </p>

        </div>
      `;


      campo.value = "";


      return;
    }


    // --------------------------------
    // ESTUDIANTE INACTIVO
    // --------------------------------

    if (
      datos.tipo === "INACTIVO"
    ) {

      const estudiante =
        datos.estudiante;


      resultado.innerHTML = `
        <div>

          <h2>⚠ ESTUDIANTE INACTIVO</h2>

          <p>
            <strong>
              ${estudiante.nombres}
            </strong>
          </p>

          <p>
            <strong>
              ${estudiante.apellidos}
            </strong>
          </p>

          <p>
            No se puede registrar
            la asistencia.
          </p>

        </div>
      `;


      campo.value = "";


      return;
    }


    // --------------------------------
    // NO ENCONTRADO
    // --------------------------------

    if (
      datos.tipo === "NO_ENCONTRADO"
    ) {

      resultado.innerHTML =
        "⚠ El estudiante no existe";

      campo.value = "";

      return;
    }


    // --------------------------------
    // OTRO ERROR
    // --------------------------------

    resultado.innerHTML =
      "⚠ " + (
        datos.mensaje ||
        "No fue posible registrar la asistencia."
      );


  } catch (error) {

    console.error(error);

    resultado.innerHTML =
      "✕ Error de comunicación con el servidor";

  }

}

    // Iniciar comprobación

    probarConexion();

let lectorQR = null;


// --------------------------------
// INICIAR LECTOR QR
// --------------------------------

function iniciarLector() {

  if (lectorQR) {
    return;
  }

  lectorQR = new Html5Qrcode("lectorQR");


  lectorQR.start(

    { facingMode: "environment" },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },


(textoQR) => {

  console.log(
    "QR detectado:",
    textoQR
  );


  const id = textoQR.trim();


  // Validar formato básico del ID
  if (!/^EST\d{5}$/.test(id)) {

    document.getElementById(
      "resultado"
    ).textContent =
      "⚠ El código QR no corresponde a un estudiante válido";

    return;
  }


  // Detener cámara
  detenerLector();


  // Colocar el resultado
  document.getElementById(
    "idEstudiante"
  ).value = id;


  // Registrar asistencia
  registrar();

},

    (error) => {

      // Los errores normales de lectura
      // no necesitan mostrarse.
      
    }

  ).catch(error => {

    console.error(error);

    document.getElementById(
      "resultado"
    ).textContent =
      "✕ No se pudo acceder a la cámara";

  });

}


// --------------------------------
// DETENER LECTOR QR
// --------------------------------

function detenerLector() {

  if (!lectorQR) {
    return;
  }


  lectorQR.stop()

    .then(() => {

      lectorQR.clear();

      lectorQR = null;

    })

    .catch(error => {

      console.error(error);

      lectorQR = null;

    });

}
    
  </script>


</body>

</html>
